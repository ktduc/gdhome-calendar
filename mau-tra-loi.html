<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mẫu trả lời khách · GD HOME</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shell.css">
  <link rel="stylesheet" href="/tools.css">
  <link rel="stylesheet" href="/mau-tra-loi.css">
  <script src="/shell.js" defer></script>
  <script src="/mau-tra-loi-data.js" defer></script>
  <script src="/mau-tra-loi.js" defer></script>
  <script src="/khao-sat-data.js" defer></script>
  <script src="/khao-sat-admin.js" defer></script>
</head>
<body class="mt-body">
  <header class="app-header">
    <div class="header-left">
      <a class="app-logo" href="/mau-tra-loi">
        <img src="/gdhome-icon.png" class="header-logo-img" alt="GD HOME">
        <span>Mẫu trả lời khách</span>
      </a>
      <details class="gd-tools-menu" data-shell-menu></details>
    </div>
    <div class="header-right">
      <div class="shell-toolbar">
        <span id="save-status" class="save-status is-inline is-saved" role="status">✓ Đã lưu</span>
        <button type="button" class="btn btn-primary" id="mt-new">+ Thêm mẫu</button>
      </div>
    </div>
  </header>

  <main class="mt-main">
    <div class="mt-tabs" role="tablist">
      <button type="button" data-tab="mau" class="is-on">Mẫu trả lời</button>
      <button type="button" data-tab="khao-sat">Khảo sát khách</button>
      <a class="mt-tab-link" href="/khao-sat/mau" target="_blank" rel="noopener" title="Mở phiếu khảo sát khách ở chế độ xem thử để góp ý (không lưu)">Phiếu mẫu ↗</a>
    </div>
    <div class="mt-bar">
      <div class="mt-seg" id="mt-kh" role="group" aria-label="Cách gọi khách">
        <button type="button" data-kh="chị">Chị</button>
        <button type="button" data-kh="anh">Anh</button>
        <button type="button" data-kh="anh chị">Anh chị</button>
        <button type="button" data-kh="em">Em</button>
      </div>
      <label class="mt-field">Tên người phụ trách <input id="mt-ten" type="text" maxlength="40" placeholder="Đức"></label>
      <label class="mt-field">Dự án <input id="mt-duan" type="text" maxlength="60" placeholder="nhà mình"></label>
      <span class="mt-hint" id="mt-who"></span>
    </div>
    <div class="mt-grid">
      <aside class="mt-side">
        <input type="search" id="mt-search" placeholder="Tìm mẫu…" aria-label="Tìm mẫu">
        <nav id="mt-groups" aria-label="Nhóm mẫu"></nav>
        <button type="button" class="btn btn-outline btn-sm" id="mt-restore" hidden></button>
      </aside>
      <section class="mt-list" id="mt-list" aria-label="Danh sách mẫu"></section>
      <section class="mt-view" id="mt-view" aria-label="Xem trước"></section>
    </div>
    <section class="sv-panel" id="sv-panel" hidden aria-label="Khảo sát khách">
      <div class="sv-row">
        <label class="mt-field">Chọn dự án <select id="sv-project"><option value="">- Chọn dự án -</option></select></label>
        <label class="mt-field" id="sv-temp-wrap">hoặc tên tạm <input id="sv-temp" type="text" maxlength="80" placeholder="vd: Chị Lan - Vinhomes"></label>
        <button type="button" class="btn btn-primary" id="sv-create">Tạo link khảo sát</button>
        <button type="button" class="btn btn-outline" id="sv-refresh">Tải lại câu trả lời</button>
      </div>
      <p class="sv-status" id="sv-status" role="status"></p>
      <ul class="sv-list" id="sv-list" aria-label="Khách đã có câu trả lời"></ul>
      <div class="sv-box" id="sv-box" hidden>
        <input id="sv-link" type="text" readonly aria-label="Link khảo sát">
        <button type="button" class="btn btn-outline" id="sv-copy-link">Copy link</button>
        <button type="button" class="btn btn-primary" id="sv-copy-msg">Copy tin nhắn mời khách</button>
      </div>
      <div class="sv-detail" id="sv-detail" hidden>
        <h2>Tóm tắt nhu cầu</h2>
        <div class="sv-cards" id="sv-summary-view"></div>
        <pre class="mt-preview" id="sv-summary" hidden></pre>
        <button type="button" class="btn btn-primary" id="sv-copy-summary">Copy tóm tắt nhu cầu</button>
      </div>
    </section>
  </main>
</body>
</html>
