name: Giu web GD HOME luon thuc
# Mo /api/health dinh ky de Render khong cho may chu ngu (goi mien phi)
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Goi /api/health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://gdhome-calendar.onrender.com/api/health || true)
            echo "Lan $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "May chu khong tra loi 200"; exit 1
