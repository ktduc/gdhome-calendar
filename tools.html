<!doctype html>
<html lang="vi">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GD HOME Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shell.css">
<link rel="stylesheet" href="/home.css">
<script src="/shell.js" defer></script>
<script src="/integrations-client.js" defer></script>
<script src="/home.js" defer></script>
<body class="home-body">
<header class="app-header"><div class="header-left"><button type="button" class="icon-btn shell-sidebar-toggle" id="btn-toggle-sidebar" aria-label="Ẩn/Hiện thanh bên trái" style="visibility:hidden;pointer-events:none;">☰</button><a class="app-logo" href="/tools"><img class="header-logo-img" src="/gdhome-icon.png" alt="GD HOME"><span>Trang chủ</span></a><details class="gd-tools-menu" data-shell-menu></details></div>
<div class="header-right"><div class="shell-toolbar"></div><div class="shell-account"><strong id="identity"></strong></div></div></header>
<main class="home-main">
  <section class="home-cover" id="home-cover">
    <div class="home-cover-text"><h1>GD HOME Tools</h1><p>Công cụ quản lý thiết kế &amp; thi công nội thất</p></div>
    <div class="home-cover-actions" hidden>
      <button type="button" data-cover-pick>🖼 Đổi ảnh bìa</button>
      <button type="button" data-cover-move title="Kéo lên / xuống để chọn phần ảnh hiển thị">↕ Căn ảnh</button>
      <button type="button" data-cover-clear>Bỏ ảnh</button>
    </div>
  </section>
  <div id="home-tools" class="home-tools"></div>
  <div class="home-bg" role="group" aria-label="Nền trang chủ"><span>Nền</span></div>
  <div id="login"></div><p id="notice" role="status"></p>
</main>
</html>
