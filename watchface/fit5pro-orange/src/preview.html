<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xem thử Orange Block</title>
<style>
  html, body { margin: 0; background: #1c1c1e; }
  body { display: flex; justify-content: center; padding: 20px 0; }
  #face { position: relative; width: 408px; height: 480px; background: #000; border-radius: 64px; overflow: hidden; }
  #face img { position: absolute; display: block; }
</style>
</head>
<body>
<div id="face"></div>
<script src="layout.js"></script>
<script>
const A = '../assets/';
const face = document.getElementById('face');
const W = LAYOUT.widgets, D = LAYOUT.digitSets;
const Q = new URLSearchParams(location.search);
const STATIC = Q.has('static');
let AOD = Q.has('aod');
const WEEK = ['thu_2', 'thu_3', 'thu_4', 'thu_5', 'thu_6', 'thu_7', 'chu_nhat'];
const CAN = ['giap', 'at', 'binh', 'dinh', 'mau', 'ky', 'canh', 'tan', 'nham', 'quy'];
const CHI = ['ty', 'suu', 'dan', 'mao', 'thin', 'ty', 'ngo', 'mui', 'than', 'dau', 'tuat', 'hoi'];
// Âm lịch xem thử: lịch Trung Hoa của trình duyệt (có thể lệch 1 ngày so với lịch Việt ở vài tháng).
const LUNAR_FMT = new Intl.DateTimeFormat('en-u-ca-chinese', { day: 'numeric', month: 'numeric', year: 'numeric' });
function lunar(d) {
  const p = Object.fromEntries(LUNAR_FMT.formatToParts(d).map((x) => [x.type, x.value]));
  return { day: parseInt(p.day, 10), month: parseInt(p.month, 10), year: parseInt(p.relatedYear, 10) };
}
function canchiFile(year) {
  const i = (((year - 4) % 60) + 60) % 60;
  return `date/canchi_${String(i).padStart(2, '0')}_${CAN[i % 10]}_${CHI[i % 12]}.png`;
}
const DATA = { weather: 'partly_cloudy', temp: 26, hi: 30, lo: 24, sunrise: '06:00', steps: 8201, heart: 87, battery: 75 };
const p2 = (n) => String(n).padStart(2, '0');

function img(src, x, y) {
  const i = new Image(); i.src = A + src; i.style.left = x + 'px'; i.style.top = y + 'px';
  face.appendChild(i); return i;
}
function digit(widgets, sets, key, d) { const w = widgets[key]; img(sets[w.set].prefix + d + '.png', w.x, w.y); }
// Độ rộng ảnh ký tự đặc biệt theo bộ số
const SPECIAL = { '-': 'minus', '/': 'sep', ':': 'sep' };
const SPECIAL_W = { temp: { '-': 11 }, hilo: { '-': 7, '/': 7 }, sun: { ':': 5 } };
function number(key, str) {
  const w = W[key], s = D[w.set], parts = [];
  for (const ch of String(str)) {
    if (/\d/.test(ch)) parts.push([s.prefix + ch + '.png', s.cell[0]]);
    else if (SPECIAL[ch]) parts.push([w[SPECIAL[ch]], SPECIAL_W[w.set][ch]]);
  }
  if (w.unit) parts.push([w.unit, w.unitW]);
  const total = parts.reduce((a, p) => a + p[1], 0);
  let x = w.align === 'center' ? Math.round(w.x - total / 2) : w.x;
  for (const [src, cw] of parts) { img(src, x, w.y); x += cw; }
}
function handImg(spec, deg) {
  const [cx, cy] = W.hands.center;
  const i = img(spec.img, cx - spec.pivot[0], cy - spec.pivot[1]);
  i.style.transformOrigin = `${spec.pivot[0]}px ${spec.pivot[1]}px`;
  i.style.transform = `rotate(${deg}deg)`;
}
function hands(H, now) {
  const h = now.getHours() % 12, m = now.getMinutes(), s = now.getSeconds();
  handImg(H.hour, (h + m / 60) * 30);
  handImg(H.minute, (m + s / 60) * 6);
  const [cx, cy] = W.hands.center;
  img(H.cap.img, cx - H.cap.w / 2, cy - H.cap.h / 2);
}
function timeDate(widgets, sets, now) {
  const g = (k, d) => digit(widgets, sets, k, d);
  const hh = p2(now.getHours()), mm = p2(now.getMinutes()), dd = p2(now.getDate()), mo = p2(now.getMonth() + 1);
  const yy = String(now.getFullYear());
  g('hourTens', hh[0]); g('hourOnes', hh[1]); g('minTens', mm[0]); g('minOnes', mm[1]);
  g('dayTens', dd[0]); g('dayOnes', dd[1]); g('monthTens', mo[0]); g('monthOnes', mo[1]);
  g('year1', yy[0]); g('year2', yy[1]); g('year3', yy[2]); g('year4', yy[3]);
}

// Thứ + âm lịch + can chi
function calendar(widgets, sets, now) {
  const wd = (now.getDay() + 6) % 7;
  img(`date/week_${wd + 1}_${WEEK[wd]}.png`, widgets.week.x, widgets.week.y);
  const lu = lunar(now), ld = p2(lu.day), lm = p2(lu.month);
  const g = (k, d) => digit(widgets, sets, k, d);
  g('lunarDayTens', ld[0]); g('lunarDayOnes', ld[1]); g('lunarMonthTens', lm[0]); g('lunarMonthOnes', lm[1]);
  img(canchiFile(lu.year), widgets.canchi.x, widgets.canchi.y);
}

function render() {
  face.innerHTML = '';
  const now = STATIC ? new Date(2026, 10, 21, 22, 42, 7) : new Date();
  if (AOD) {
    img('aod/background_aod.png', 0, 0);
    timeDate(LAYOUT.aod.widgets, LAYOUT.aod.digitSets, now);
    calendar(LAYOUT.aod.widgets, LAYOUT.aod.digitSets, now);
    hands(LAYOUT.aod.widgets.hands, now);
  } else {
    img('background.png', 0, 0);
    timeDate(W, D, now);
    const ss = p2(now.getSeconds());
    digit(W, D, 'secTens', ss[0]); digit(W, D, 'secOnes', ss[1]);
    calendar(W, D, now);
    img(`weather/${DATA.weather}.png`, W.weather.x, W.weather.y);
    number('temp', DATA.temp);
    number('tempHiLo', DATA.hi + '/' + DATA.lo);
    number('sunrise', DATA.sunrise);
    number('steps', DATA.steps);
    number('heart', DATA.heart);
    number('battery', DATA.battery);
    hands(W.hands, now);
  }
  return Promise.all([...face.querySelectorAll('img')].map((i) => i.decode().catch(() => {})));
}
render().then(() => { window.__ready = true; });
if (!STATIC) {
  setInterval(render, 1000);
  face.title = 'Bấm để chuyển màn hình thường / AOD';
  face.style.cursor = 'pointer';
  face.addEventListener('click', () => { AOD = !AOD; render(); });
}
</script>
</body>
</html>
