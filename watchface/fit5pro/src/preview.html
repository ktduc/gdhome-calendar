<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xem thử Fit 5 Pro</title>
<style>
  html, body { margin: 0; background: #1c1c1e; }
  body { display: flex; justify-content: center; padding: 20px 0; }
  #face { position: relative; width: 408px; height: 480px; background: #000; border-radius: 64px; overflow: hidden; }
  #face img { position: absolute; display: block; }
</style>
</head>
<body>
<div id="face"></div>
<script src="layout.js"></script>
<script>
const A = '../assets/';
const face = document.getElementById('face');
const W = LAYOUT.widgets, D = LAYOUT.digitSets;
const STATIC = new URLSearchParams(location.search).has('static');
const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const WEEK = ['MON','TUE','WED','THU','FRI','SAT','SUN'];
const WEATHER = { code: 'partly_cloudy', temp: 26, hi: 30, lo: 24, sunrise: '06:00' };

function img(src, x, y) {
  const i = new Image(); i.src = A + src; i.style.left = x + 'px'; i.style.top = y + 'px';
  face.appendChild(i); return i;
}
function digit(key, d) { const w = W[key]; img(D[w.set].prefix + d + '.png', w.x, w.y); }
// Chuỗi số + ký tự đặc biệt, căn trái/giữa theo widget.
function number(key, str, extra = {}) {
  const w = W[key], s = D[w.set];
  const parts = [];
  for (const ch of String(str)) {
    if (/\d/.test(ch)) parts.push([s.prefix + ch + '.png', s.cell[0]]);
    else if (ch === '-') parts.push([w.minus || 'data/num_minus.png', 12]);
    else if (ch === '/') parts.push([w.sep, 8]);
    else if (ch === ':') parts.push([w.sep, 6]);
  }
  if (w.unit) parts.push([w.unit, w.unitW]);
  const total = parts.reduce((a, p) => a + p[1], 0);
  let x = w.align === 'center' ? Math.round(w.x - total / 2) : w.x;
  for (const [src, cw] of parts) { img(src, x, w.y); x += cw; }
}

function render() {
  face.innerHTML = '';
  const now = STATIC ? new Date(2026, 10, 3, 22, 42, 7) : new Date();
  img('background.png', 0, 0);
  const p2 = (n) => String(n).padStart(2, '0');
  const hh = p2(now.getHours()), mm = p2(now.getMinutes()), ss = p2(now.getSeconds()), dd = p2(now.getDate());
  digit('hourTens', hh[0]); digit('hourOnes', hh[1]);
  digit('minTens', mm[0]); digit('minOnes', mm[1]);
  digit('secTens', ss[0]); digit('secOnes', ss[1]);
  const wd = (now.getDay() + 6) % 7;
  img(`date/week_${wd + 1}_${WEEK[wd]}.png`, W.week.x, W.week.y);
  digit('dayTens', dd[0]); digit('dayOnes', dd[1]);
  const m = now.getMonth();
  img(`date/month_${p2(m + 1)}_${MONTHS[m]}.png`, W.month.x, W.month.y);
  number('temp', WEATHER.temp);
  number('tempHiLo', WEATHER.hi + '/' + WEATHER.lo);
  img(`weather/${WEATHER.code}.png`, W.weather.x, W.weather.y);
  number('sunrise', WEATHER.sunrise);
  number('steps', 8201);
  number('heart', 87);
  number('battery', 75);
  return Promise.all([...face.querySelectorAll('img')].map((i) => i.decode().catch(() => {})));
}
render().then(() => { window.__ready = true; });
if (!STATIC) setInterval(render, 1000);
</script>
</body>
</html>
