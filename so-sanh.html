<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bảng so sánh · GD HOME</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shell.css?v=gd25">
  <link rel="stylesheet" href="/tools.css?v=gd18d">
  <link rel="stylesheet" href="/asset-library.css?v=undo1">
  <link rel="stylesheet" href="/so-sanh.css?v=cmp2">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <script src="/shell.js?v=gd25" defer></script>
  <script src="/image-compression.js?v=gd20.14.3" defer></script>
  <script src="/material-template.js" defer></script>
  <script src="/ai-client.js?v=gd21.2" defer></script>
  <script src="/library-attributes.js?v=library-tools-1" defer></script>
  <script src="/catalogue-import-history.js?v=gd20.12" defer></script>
  <script src="/asset-library.js?v=undo1" defer></script>
  <script src="/integrations-client.js?v=dlg1" defer></script>
  <script src="/so-sanh.js?v=cmp2" defer></script>
<link rel="stylesheet" href="/timeline-todo.css?v=todo9">
<script src="/timeline-todo.js?v=todo9" defer></script>
</head>
<body class="cmp-body">
  <header class="app-header">
    <div class="header-left">
      <button type="button" class="icon-btn shell-sidebar-toggle" id="btn-toggle-sidebar" title="Ẩn/Hiện thanh bên trái" aria-label="Ẩn/Hiện thanh bên trái"><i data-lucide="menu">☰</i></button>
      <a class="app-logo" href="/so-sanh">
        <img src="/gdhome-icon.png" class="header-logo-img" alt="GD HOME">
        <span>Bảng so sánh</span>
      </a>
      <details class="gd-tools-menu" data-shell-menu></details>
    </div>
    <div class="header-right">
      <div class="hdr-undo-group">
        <button type="button" class="btn btn-outline hdr-icon-sq" id="cmp-undo" title="Hoàn tác (Ctrl+Z)" aria-label="Hoàn tác" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        </button>
        <button type="button" class="btn btn-outline hdr-icon-sq" id="cmp-redo" title="Làm lại (Ctrl+Y)" aria-label="Làm lại" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
        </button>
      </div>
      <span id="save-status" class="save-status is-inline" role="status">✓ Đã lưu</span>
    </div>
  </header>

  <div class="cmp-layout">
    <aside class="shell-sidebar cmp-sidebar" id="cmp-sidebar">
      <section class="cmp-batch">
        <label for="cmp-ideas"><strong>Nhập ý tưởng so sánh</strong> <small>(mỗi dòng 1 bảng)</small></label>
        <textarea id="cmp-ideas" rows="5" placeholder="Ví dụ:&#10;Cửa có khuôn và cửa giấu khuôn&#10;Cốt gỗ MFC, MDF, HDF&#10;Sơn bệt và Laminate cho cánh tủ"></textarea>
        <button type="button" class="btn btn-primary btn-sm" id="cmp-run">✨ Gửi AI làm bảng</button>
        <div class="cmp-progress" id="cmp-progress" role="status" hidden></div>
        <ul class="cmp-queue" id="cmp-queue" aria-live="polite"></ul>
      </section>
      <div class="cmp-cats-head">
        <strong>Danh mục</strong>
        <button type="button" class="btn btn-outline btn-sm" id="cmp-add-cat" title="Thêm hạng mục lớn">+ Hạng mục</button>
      </div>
      <nav class="cmp-tree" id="cmp-tree" aria-label="Danh mục bảng so sánh"></nav>
    </aside>

    <main class="cmp-main">
      <div class="cmp-toolbar" id="cmp-toolbar" hidden>
        <label>Hạng mục <select id="cmp-cat-select"></select></label>
        <div class="cmp-seg" role="group" aria-label="Bố cục">
          <button type="button" data-cols="2">2 cột</button>
          <button type="button" data-cols="3">3 cột</button>
        </div>
        <div class="cmp-seg" role="group" aria-label="Thu phóng">
          <button type="button" data-zoom="fit" title="Thu nhỏ vừa vùng làm việc">Vừa khung</button>
          <button type="button" data-zoom="full" title="Xem đúng 100% để sửa kỹ">100%</button>
        </div>
        <button type="button" class="btn btn-outline btn-sm" id="cmp-approve"></button>
        <span class="cmp-spacer"></span>
        <button type="button" class="btn btn-outline btn-sm" id="cmp-delete">Xoá bảng</button>
        <button type="button" class="btn btn-success btn-sm" id="cmp-copy" title="Copy ảnh bảng để dán vào Zalo, Word…">Copy ảnh</button>
        <button type="button" class="btn btn-success btn-sm" id="cmp-export">Tải PNG</button>
      </div>
      <div class="cmp-stage" id="cmp-stage">
        <p class="cmp-empty" id="cmp-empty">Chọn một bảng ở danh mục bên trái, hoặc nhập ý tưởng để AI làm bảng mới.</p>
        <div id="cmp-sheet-wrap"></div>
      </div>
    </main>
  </div>
  <input type="file" id="cmp-file" accept="image/*" hidden>
</body>
</html>
